name: VICEBOUND Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - vicebound/android-foundation
    paths:
      - "handoff/**"
      - "game/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Import, validate and export Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source, Git LFS assets and submodules
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Overlay uploaded VICEBOUND project bundle
        shell: bash
        run: |
          ARCHIVE="handoff/VICEBOUND-Android-Foundation-v0.4-AUDITED.zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Missing $ARCHIVE. Upload the audited VICEBOUND ZIP to this exact path."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vicebound-bundle"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/vicebound-bundle"
          SOURCE="$RUNNER_TEMP/vicebound-bundle/VICEBOUND-Android-Foundation"
          test -f "$SOURCE/game/project.godot"
          rsync -a --exclude='.git' --exclude='.github/workflows/android-build.yml' "$SOURCE/" ./
          git lfs pull
          git submodule update --init --recursive
          python3 - <<'PY'
          from pathlib import Path
          root = Path("game")
          pointers = []
          for p in root.rglob("*"):
              if p.is_file():
                  try:
                      if p.open("rb").read(80).startswith(b"version https://git-lfs.github.com/spec/v1"):
                          pointers.append(str(p))
                  except OSError:
                      pass
          if pointers:
              raise SystemExit(f"{len(pointers)} Git LFS pointer files remain; first: {pointers[:10]}")
          print("Git LFS payload check passed")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_PATH/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --licenses </dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Godot Android SDK paths and debug signing
        run: |
          mkdir -p ~/.config/godot ~/.android
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Validate source structure
        run: python3 tools/validate_android_source.py --require-lfs

      - name: Import project and export Android APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          relative_project_path: ./game
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          verbose: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vicebound-android-debug
          path: dist/vicebound-android-debug.apk
          if-no-files-found: error
          retention-days: 14
